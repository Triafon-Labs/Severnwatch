name: Auto Tag

on:
  push:
    branches: [main]

permissions:
  contents: write

# Two merges in quick succession would otherwise race: both bump from the same
# base and the second push is rejected or clobbers the first one's tag. Queue
# them instead, and never cancel a release that is already pushing.
concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  release:
    # Skip the release commit's own push so it can't trigger itself again.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      # Heal unconditionally here: releasing must not stall on a lockfile that a
      # merged Dependabot PR left incomplete. commit-and-tag-version commits
      # package-lock.json as part of the release commit, so the repair lands on
      # main and the drift is gone for good.
      - name: Install dependencies
        uses: ./.github/actions/npm-install
        with:
          heal: always
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      # A `Release-As: x.y.z` footer on any commit since the last release sets
      # the next version outright. Below 1.0 the tool turns a breaking change
      # into a minor bump, so this is the only way to reach a major version.
      # Only tags in main's history count, so the footer is spent once the
      # release it asked for is tagged.
      - name: Bump version, update changelog, and tag
        run: |
          last_tag=$(git describe --tags --abbrev=0 --match 'severnwatch-v*' 2>/dev/null || true)
          release_as=$(git log "${last_tag:+$last_tag..}HEAD" --format=%B \
            | sed -n 's/^Release-As:[[:space:]]*\([0-9][^[:space:]]*\)[[:space:]]*$/\1/p' \
            | head -n 1)
          if [ -n "$release_as" ]; then
            echo "Release-As footer found: releasing $release_as"
            npx commit-and-tag-version --tag-prefix "severnwatch-v" --release-as "$release_as"
          else
            npx commit-and-tag-version --tag-prefix "severnwatch-v"
          fi
      - name: Push release commit and tag
        run: git push --follow-tags origin HEAD:main
