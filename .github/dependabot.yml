version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    # Skip releases younger than a week, so a broken or yanked publish is
    # usually fixed before it reaches a PR. Security updates ignore this.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    # Counts version-update PRs only. Majors open one PR each, so leaving three
    # of them unmerged holds back the monthly minor/patch batch.
    open-pull-requests-limit: 3
    ignore:
      # typescript-eslint (via eslint-config-next) doesn't support TypeScript 7
      # yet, so lint crashes on it. Remove once it does.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # MUI packages peer-depend on the same major, so one bumped alone fails
      # to install. Listed first so its majors land here, not as separate PRs.
      mui-major:
        patterns: ["@mui/*"]
        update-types:
          - "major"
      minor-and-patch-dependencies:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
      # Security updates ignore open-pull-requests-limit and the groups above,
      # and open one PR per package (mostly transitive deps) unless grouped.
      security-updates:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 3
    groups:
      minor-and-patch-actions:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
