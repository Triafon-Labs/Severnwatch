version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    # Skip releases younger than a week, so a broken or yanked publish is
    # usually fixed before it reaches a PR. Security updates ignore this.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    # Counts version-update PRs only. Majors open one PR each, so leaving two
    # of them unmerged holds back the monthly minor/patch batch.
    open-pull-requests-limit: 2
    groups:
      minor-and-patch-dependencies:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
      # Security updates ignore open-pull-requests-limit and the groups above,
      # and open one PR per package (mostly transitive deps) unless grouped.
      security-updates:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 2
    groups:
      minor-and-patch-actions:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
